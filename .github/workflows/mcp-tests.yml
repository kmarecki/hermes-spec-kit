name: spec-kit tests

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mcp pyyaml

      - name: Validate skill files (frontmatter, references, templates)
        run: python3 spec-kit-mcp-server/test_skills.py

      - name: Run MCP server workflow tests
        run: python3 spec-kit-mcp-server/test_workflow.py
